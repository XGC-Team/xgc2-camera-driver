schema: xgc2.product.v1
id: xgc2-camera-ros1
name: XGC2 ROS1 Camera Driver
version: 0.3.0-20
kind: ros1-apt
summary: ROS1 adapter for the independently released XGC2 Linux camera core.
ros:
  distro: melodic,noetic
  workspace: catkin
  packages:
  - xgc2_camera_driver
apt:
  distribution: bionic,focal
  install:
  - ros-melodic-xgc2-camera-driver
  - ros-noetic-xgc2-camera-driver
  packages:
  - ros-melodic-xgc2-camera-driver
  - ros-noetic-xgc2-camera-driver
  package_distributions:
    ros-melodic-xgc2-camera-driver:
    - bionic
    ros-noetic-xgc2-camera-driver:
    - focal
  package_architectures:
    ros-melodic-xgc2-camera-driver:
    - amd64
    - arm64
    ros-noetic-xgc2-camera-driver:
    - amd64
    - arm64
  depends:
  - ffmpeg
  - libavcodec57
  - libavcodec58
  - libavutil55
  - libavutil56
  - libopencv-core3.2
  - libopencv-core4.2
  - libopencv-imgcodecs3.2
  - libopencv-imgcodecs4.2
  - libopencv-imgproc3.2
  - libopencv-imgproc4.2
  - libswscale4
  - libswscale5
  - libxgc2-camera-dev (>= 0.1.0-10~bionic)
  - libxgc2-camera-dev (>= 0.1.0-10~focal)
  - ros-melodic-camera-info-manager
  - ros-noetic-camera-info-manager
  - ros-melodic-cv-bridge
  - ros-noetic-cv-bridge
  - ros-melodic-diagnostic-msgs
  - ros-noetic-diagnostic-msgs
  - ros-melodic-diagnostic-updater
  - ros-noetic-diagnostic-updater
  - ros-noetic-foxglove-msgs
  - ros-melodic-image-transport
  - ros-noetic-image-transport
  - ros-melodic-roscpp
  - ros-noetic-roscpp
  - ros-melodic-roslaunch
  - ros-noetic-roslaunch
  - ros-melodic-rosbag
  - ros-noetic-rosbag
  - ros-melodic-rostopic
  - ros-noetic-rostopic
  - ros-melodic-sensor-msgs
  - ros-noetic-sensor-msgs
  - ros-melodic-xgc2-camera-msgs (>= 1.2.0-8)
  - ros-noetic-xgc2-camera-msgs (>= 1.2.0-8)
usage:
  install: 'sudo apt update

    sudo apt install ros-melodic-xgc2-camera-driver

    sudo apt install ros-noetic-xgc2-camera-driver

    '
  smoke_test: 'roslaunch xgc2_camera_driver camera.launch backend:=synthetic pixel_format:=bgr24

    rostopic echo -n 1 /usb_cam/camera_info

    '
  notes: 'One process owns one camera. Native H264 is forwarded without

    re-encoding as foxglove_msgs/CompressedVideo; native MJPEG is forwarded as

    sensor_msgs/CompressedImage. Raw Image decoding is on-demand. FrameTiming,

    StreamInfo, CameraInfo, and diagnostics preserve the scientific timing

    contract. Calibration tools are released independently. Melodic has no

    archive foxglove_msgs, so that interface is built with this package.

    '
ownership:
  paths:
  - /opt/ros/melodic/share/xgc2_camera_driver
  - /opt/ros/melodic/lib/xgc2_camera_driver
  - /opt/ros/noetic/share/xgc2_camera_driver
  - /opt/ros/noetic/lib/xgc2_camera_driver
release:
  requires:
  - libxgc2-camera-dev
  - xgc2-ros-msgs
  dependency_policy:
    libxgc2-camera-dev: rebuild
    xgc2-ros-msgs: rebuild
  repository: XGC-Team/xgc2-camera-driver
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    bionic: 0.3.0-20
    focal: 0.3.0-20
