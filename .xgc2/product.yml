schema: xgc2.product.v1
id: xgc2-camera-ros1
name: XGC2 ROS1 Camera Driver
version: 0.4.0-1
kind: ros1-apt
summary: ROS1 adapter for the independently released XGC2 Linux camera core.
ros:
  distro: melodic,noetic
  workspace: catkin
  packages:
  - xgc2_camera_driver
apt:
  distribution: bionic,focal
  install:
  - ros-melodic-xgc2-camera-driver
  - ros-noetic-xgc2-camera-driver
  packages:
  - ros-melodic-xgc2-camera-driver
  - ros-noetic-xgc2-camera-driver
  package_distributions:
    ros-melodic-xgc2-camera-driver:
    - bionic
    ros-noetic-xgc2-camera-driver:
    - focal
  package_architectures:
    ros-melodic-xgc2-camera-driver:
    - amd64
    - arm64
    ros-noetic-xgc2-camera-driver:
    - amd64
    - arm64
  depends:
  - libavcodec58
  - libavutil56
  - libopencv-core3.2
  - libopencv-core4.2
  - libopencv-imgcodecs3.2
  - libopencv-imgcodecs4.2
  - libopencv-imgproc3.2
  - libopencv-imgproc4.2
  - libswscale5
  - libxgc2-camera-dev (>= 0.1.0-10~bionic)
  - libxgc2-camera-dev (>= 0.1.0-10~focal)
  - libxgc2-xrpc2
  - libyaml-cpp0.5v5
  - libyaml-cpp0.6
  - ros-melodic-camera-info-manager
  - ros-noetic-camera-info-manager
  - ros-melodic-cv-bridge
  - ros-noetic-cv-bridge
  - ros-melodic-diagnostic-msgs
  - ros-noetic-diagnostic-msgs
  - ros-melodic-diagnostic-updater
  - ros-noetic-diagnostic-updater
  - ros-noetic-foxglove-msgs
  - ros-melodic-geometry-msgs
  - ros-noetic-geometry-msgs
  - ros-melodic-image-transport
  - ros-noetic-image-transport
  - ros-melodic-roscpp
  - ros-noetic-roscpp
  - ros-melodic-roslaunch
  - ros-noetic-roslaunch
  - ros-melodic-rosbag
  - ros-noetic-rosbag
  - ros-melodic-rostopic
  - ros-noetic-rostopic
  - ros-melodic-sensor-msgs
  - ros-noetic-sensor-msgs
  - ros-melodic-tf2-ros
  - ros-noetic-tf2-ros
  - ros-melodic-xgc2-camera-msgs (>= 1.5.0-1)
  - ros-noetic-xgc2-camera-msgs (>= 1.5.0-1)
usage:
  install: 'sudo apt update

    sudo apt install ros-melodic-xgc2-camera-driver

    sudo apt install ros-noetic-xgc2-camera-driver

    '
  smoke_test: 'roslaunch xgc2_camera_driver camera.launch source_kind:=synthetic

    rostopic echo -n 1 /usb_cam/camera_info

    '
  notes: 'One process owns one camera. Native MJPEG is forwarded as

    sensor_msgs/CompressedImage; a sealed still image is published once and

    latched. Raw Image decoding is on-demand. FrameTiming, StreamInfo,

    CameraInfo, and diagnostics preserve the scientific timing contract.

    Calibration tools are released independently. Melodic has no archive

    foxglove_msgs, so that interface is built with this package.

    '
ownership:
  paths:
  - /usr/share/xgc2/process-definitions/xgc2-camera-v4l2.json
  - /usr/share/xgc2/process-definitions/xgc2-camera-still.json
  - /opt/ros/melodic/share/xgc2_camera_driver
  - /opt/ros/melodic/lib/xgc2_camera_driver
  - /opt/ros/noetic/share/xgc2_camera_driver
  - /opt/ros/noetic/lib/xgc2_camera_driver
release:
  requires:
  - libxgc2-camera-dev
  - xgc2-ros-msgs
  - xgc2-xrpc
  dependency_policy:
    libxgc2-camera-dev: rebuild
    xgc2-ros-msgs: rebuild
    xgc2-xrpc: rebuild
  repository: XGC-Team/xgc2-camera-driver
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    bionic: 0.4.0-1
    focal: 0.4.0-1
